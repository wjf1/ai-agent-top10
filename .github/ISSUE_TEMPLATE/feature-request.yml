name: 功能建议 / Feature request
description: 对站点功能、可视化或数据维度的改进建议
title: "[功能建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提建议 👋

        提之前建议先看一眼 [README](https://github.com/wjf1/ai-agent-top10#readme) 与
        [PLAN.md](https://github.com/wjf1/ai-agent-top10/blob/main/PLAN.md)：
        有些想法可能已经在计划中，或已被评估并明确排除（附理由）。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述使用场景与痛点，而不只是功能名
      placeholder: |
        我在……的时候，遇到……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 可选。如果你已经有具体想法，写在这里
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 榜单 / 排名逻辑
        - 评分维度
        - 详情页与图表
        - 检索与筛选
        - 多仓库对比
        - 数据导出 / API
        - 无障碍与移动端
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认
      options:
        - label: 我知道本站是纯静态站点（无后端、无数据库、无运行时 API），建议需在此约束内可行
          required: true
        - label: 我理解「无 JS 时页面仍可完整阅读」是本站的既定原则，不希望为功能牺牲它
          required: false
