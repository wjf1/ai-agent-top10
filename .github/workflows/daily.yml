name: daily-update

# 每天 UTC 06:00（北京时间 14:00）抓取数据；代码 push 时只重建站点。
# 手动触发会同时执行抓取与部署。
# PR 只跑校验（测试 / 数据 / 构建），既不抓取也不部署 —— 否则未合并的代码会先上线一次。
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # PR 校验按 PR 号分组，不占用生产部署的 pages 队列（否则会互相排队）
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # job 0：PR 校验 —— 与 main 上同一套 check（test + validate + build）
  # ------------------------------------------------------------------
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Test, validate data, build site
        run: npm run check
        env:
          BASE: /${{ github.event.repository.name }}

  # ------------------------------------------------------------------
  # job 1：抓数据 → 校验 → 只有校验通过才 commit & push
  # 旧版把 commit 放在 build 之前且没有校验，build 失败时脏数据已经推上去了（P1-A3）。
  # ------------------------------------------------------------------
  fetch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      # 前置检查：解读服务未配置时不再「静默降级」。
      # 默认输出 warning 并继续（回落到规则文案）；把仓库变量 LLM_REQUIRED 设为 true，
      # 即在缺少 secrets.LLM_API_KEY 时硬失败、阻断本次部署（符合 T1.3 的验收要求）。
      - name: Preflight — interpretation service
        run: |
          if [ -z "${LLM_API_KEY:-}" ]; then
            if [ "${LLM_REQUIRED:-}" = "true" ]; then
              echo "::error title=解读服务未配置::已设置 LLM_REQUIRED=true 但缺少 secrets.LLM_API_KEY，按预案阻断本次部署。"
              exit 1
            fi
            echo "::warning title=解读服务未配置::未提供 secrets.LLM_API_KEY，本次抓取将回落到规则模板文案。配置该 secret 后站点才会有 AI 解读。"
          else
            echo "解读服务已配置：base=${LLM_BASE_URL:-<config 默认>} model=${LLM_MODEL:-<config 默认>}"
          fi
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_REQUIRED: ${{ vars.LLM_REQUIRED }}

      - name: Fetch daily data
        run: node scripts/fetch-daily.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 解读（项目介绍 / 亮点）由 LLM 读 README 生成。runner 上访问不到本机的
          # 127.0.0.1:9090 网关，所以这里要用外部兼容服务：配好 secrets.LLM_API_KEY
          # 与 vars.LLM_BASE_URL / vars.LLM_MODEL（DeepSeek、OpenAI 等均可）。
          # 未配置时自动回落到规则化文案，抓取照常完成、不会失败。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 备用解读服务（可选）：主服务失败时自动切换。三个变量都可留空。
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}

      - name: Backfill snapshot history
        run: node scripts/backfill-metrics.mjs

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "no data change"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "daily update $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # job 2：只有数据校验通过（或本次不抓取）才构建部署
  # ------------------------------------------------------------------
  build:
    needs: [fetch]
    if: always() && github.event_name != 'pull_request' && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Validate data before build
        run: node scripts/validate-data.mjs

      - name: Build site
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
