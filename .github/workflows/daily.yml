name: daily-update

# 每天 UTC 06:00（北京时间 14:00）抓取数据；代码 push 时只重建站点。
# 手动触发会同时执行抓取与部署。
# PR 只跑校验（测试 / 数据 / 构建），既不抓取也不部署 —— 否则未合并的代码会先上线一次。
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 顶层默认只给读权限；写权限按 job 最小化声明（fetch 提交数据、build 部署 Pages）。
# fallback 解读服务是匿名端点（Pollinations，key 仅占位），不需要也不应持有任何 token 权限。
permissions:
  contents: read

concurrency:
  # PR 校验按 PR 号分组，不占用生产部署的 pages 队列（否则会互相排队）
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # job 0：PR 校验 —— 与 main 上同一套 check（test + validate + build）
  # ------------------------------------------------------------------
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7（SHA pin：浮动 tag 可被覆盖重放）

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7（SHA pin）
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test, validate data, build site
        run: npm run check
        env:
          BASE: /${{ github.event.repository.name }}

  # ------------------------------------------------------------------
  # job 1：抓数据 → 校验 → 只有校验通过才 commit & push
  # 旧版把 commit 放在 build 之前且没有校验，build 失败时脏数据已经推上去了（P1-A3）。
  # ------------------------------------------------------------------
  fetch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7（SHA pin：浮动 tag 可被覆盖重放）

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7（SHA pin）
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 解读缓存跨日复用：README 哈希未变的仓库跳过 LLM 调用。无此缓存时 CI 每日全量冷跑
      # （缓存文件已 gitignore），用滚动 key（run_id）保存最新、restore-keys 前缀恢复。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（SHA pin）
        with:
          path: src/data/snapshots/interpret-cache.json
          key: interpret-cache-${{ github.run_id }}
          restore-keys: |
            interpret-cache-

      # 前置检查：解读服务未配置时不再「静默降级」。
      # 默认输出 warning 并继续（回落到规则文案）；把仓库变量 LLM_REQUIRED 设为 true，
      # 即在缺少 secrets.LLM_API_KEY 时硬失败、阻断本次部署（符合 T1.3 的验收要求）。
      - name: Preflight — interpretation service
        run: |
          if [ -z "${LLM_API_KEY:-}" ]; then
            if [ "${LLM_REQUIRED:-}" = "true" ]; then
              echo "::error title=解读服务未配置::已设置 LLM_REQUIRED=true 但缺少 secrets.LLM_API_KEY，按预案阻断本次部署。"
              exit 1
            fi
            echo "::warning title=解读服务未配置::未提供 secrets.LLM_API_KEY，本次抓取将回落到规则模板文案。配置该 secret 后站点才会有 AI 解读。"
          else
            echo "解读服务已配置：base=${LLM_BASE_URL:-<config 默认>} model=${LLM_MODEL:-<config 默认>}"
          fi
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_REQUIRED: ${{ vars.LLM_REQUIRED }}

      - name: Fetch daily data
        run: node scripts/fetch-daily.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 解读（项目介绍 / 亮点）由 LLM 读 README 生成。runner 上访问不到本机的
          # 127.0.0.1:9090 网关，所以这里要用外部兼容服务：配好 secrets.LLM_API_KEY
          # 与 vars.LLM_BASE_URL / vars.LLM_MODEL（DeepSeek、OpenAI 等均可）。
          # 未配置时自动回落到规则化文案，抓取照常完成、不会失败。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 备用解读服务（可选）：主服务失败时自动切换。三个变量都可留空。
          # fallback 端点（Pollinations）匿名无鉴权，key 只需非空占位值——未配置 secret
          # 时用字面 'anonymous'，绝不回落 GITHUB_TOKEN（带写权限的仓库令牌绝不能外发第三方）。
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || 'anonymous' }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}

      - name: Backfill snapshot history
        run: node scripts/backfill-metrics.mjs

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "no data change"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "daily update $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # job 2：只有数据校验通过（或本次不抓取）才构建部署
  # ------------------------------------------------------------------
  build:
    needs: [fetch]
    if: always() && github.event_name != 'pull_request' && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7（SHA pin：浮动 tag 可被覆盖重放）

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7（SHA pin）
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate data before build
        run: node scripts/validate-data.mjs

      - name: Build site
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5（SHA pin）

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3（SHA pin）
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4（SHA pin）

  # ------------------------------------------------------------------
  # job 3：告警 —— fetch / build 任一失败时开 issue（对齐 coding-plan-radar 的
  # 「失败可见」机制，替代此前的静默失败：11-10 的失败靠下一次成功才被发现）。
  # 当日已有同标题 issue 时不重复开。
  # ------------------------------------------------------------------
  alert:
    needs: [fetch, build]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: 失败时开 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="每日巡检失败 $(date -u +%F)"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "in:title $TITLE" --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "已存在当日失败 issue，跳过创建"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body "daily-update 工作流失败：fetch=${{ needs.fetch.result }}，build=${{ needs.build.result }}。请查看 [Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 排查。"
