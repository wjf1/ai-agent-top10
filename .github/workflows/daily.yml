name: daily-update

# 每天 UTC 06:00（北京时间 14:00）自动抓取数据、重建并部署；支持手动触发
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      # 抓取今日数据 + 评分（内置 token 复用 GITHUB_TOKEN 调用 GitHub API）
      - run: node scripts/fetch-daily.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 提交新数据到仓库（无变化则跳过）
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push

      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
