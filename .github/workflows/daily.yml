name: daily-update

# 每天 UTC 06:00（北京时间 14:00）抓取数据；代码 push 时只重建站点。
# 手动触发会同时执行抓取与部署。
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # job 1：抓数据 → 校验 → 只有校验通过才 commit & push
  # 旧版把 commit 放在 build 之前且没有校验，build 失败时脏数据已经推上去了（P1-A3）。
  # ------------------------------------------------------------------
  fetch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Fetch daily data
        run: node scripts/fetch-daily.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：配置了密钥就让 LLM 生成解读，否则自动回落到规则化文案
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Backfill snapshot history
        run: node scripts/backfill-metrics.mjs

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "no data change"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "daily update $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # job 2：只有数据校验通过（或本次不抓取）才构建部署
  # ------------------------------------------------------------------
  build:
    needs: [fetch]
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || npm install

      - name: Validate data before build
        run: node scripts/validate-data.mjs

      - name: Build site
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
