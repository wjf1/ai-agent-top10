<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="ai-agent-top10 architecture: GitHub API to data pipeline to static site">
  <defs>
    <style>
      .t { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #171a23; }
      .b { font-size: 12.5px; fill: #3a4152; }
      .s { font-size: 11px; fill: #6b7280; }
      .lane { font-size: 12px; font-weight: 700; fill: #4f46e5; letter-spacing: .08em; }
      .box { fill: #ffffff; stroke: #e6e8ef; stroke-width: 1.2; }
      .box-accent { fill: #eef0ff; stroke: #c7c9f7; stroke-width: 1.2; }
      .box-data { fill: #f7f8fb; stroke: #d9dcea; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .flow { stroke: #b9bfd4; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-strong { stroke: #4f46e5; stroke-width: 1.8; fill: none; marker-end: url(#arrow-accent); }
      .chip { fill: #e7f7f0; stroke: #b7e4cf; stroke-width: 1; }
      .chip-t { font-size: 10.5px; fill: #059669; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b9bfd4" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff" />
  <text class="t h" x="34" y="40" font-size="19">ai-agent-top10 · 数据流与站点架构</text>
  <text class="t s" x="34" y="62">Data flow and site architecture — 全链路静态化，无运行时后端</text>

  <!-- lane labels -->
  <text class="t lane" x="34" y="104">01 · COLLECT</text>
  <text class="t lane" x="352" y="104">02 · PERSIST</text>
  <text class="t lane" x="676" y="104">03 · RENDER</text>

  <!-- lane 1 -->
  <rect class="box" x="34" y="116" width="272" height="58" rx="10" />
  <text class="t b" x="48" y="140" font-weight="600">GitHub REST API</text>
  <text class="t s" x="48" y="160">Search · stargazers · contributors · releases · pulls · issues</text>

  <rect class="box box-accent" x="34" y="192" width="272" height="140" rx="10" />
  <text class="t b" x="48" y="216" font-weight="600">scripts/fetch-daily.mjs</text>
  <text class="t s" x="48" y="236">编排层：串起下面 6 个模块</text>
  <text class="t s" x="48" y="262">lib/github.mjs · 限流 / 超时 / 退避重试</text>
  <text class="t s" x="48" y="282">lib/candidates.mjs · 候选发现</text>
  <text class="t s" x="48" y="302">lib/growth.mjs · star / fork 增速</text>
  <text class="t s" x="48" y="322">lib/metrics.mjs · 指标采集（含 PR/issue 活跃度）</text>

  <rect class="box" x="34" y="352" width="272" height="74" rx="10" />
  <text class="t b" x="48" y="376" font-weight="600">src/lib/scoring.mjs</text>
  <text class="t s" x="48" y="396">8 维评分引擎（纯函数）</text>
  <text class="t s" x="48" y="414">权重/阈值全部来自 config/scoring.json</text>

  <path class="flow" d="M 170 174 L 170 192" />
  <path class="flow" d="M 170 332 L 170 352" />

  <!-- lane 2 -->
  <rect class="box box-data" x="352" y="116" width="288" height="52" rx="10" />
  <text class="t b" x="366" y="138" font-weight="600">src/data/daily/&lt;date&gt;.json</text>
  <text class="t s" x="366" y="157">每日 Top10 榜单 + 8 维评分 + 解读</text>

  <rect class="box box-data" x="352" y="180" width="288" height="52" rx="10" />
  <text class="t b" x="366" y="202" font-weight="600">snapshots/stars.json</text>
  <text class="t s" x="366" y="221">star 序列 → 真实增量基线与趋势图</text>

  <rect class="box box-data" x="352" y="244" width="288" height="52" rx="10" />
  <text class="t b" x="366" y="266" font-weight="600">snapshots/metrics.json</text>
  <text class="t s" x="366" y="285">完整指标 + fork 基线（滚动保留 120 天）</text>

  <rect class="box box-data" x="352" y="308" width="288" height="52" rx="10" />
  <text class="t b" x="366" y="330" font-weight="600">index.json（聚合索引）</text>
  <text class="t s" x="366" y="349">日期 / 摘要 / slug 列表，避免全量 eager 加载</text>

  <rect class="box" x="352" y="380" width="288" height="46" rx="10" />
  <text class="t b" x="366" y="402" font-weight="600">scripts/validate-data.mjs</text>
  <text class="t s" x="366" y="420">CI 门禁：结构、评分范围、URL 协议、HTML 注入</text>

  <path class="flow-strong" d="M 306 262 L 352 142" />
  <path class="flow" d="M 306 262 L 352 206" />
  <path class="flow" d="M 306 262 L 352 270" />
  <path class="flow" d="M 306 380 L 352 334" />
  <path class="flow-strong" d="M 496 360 L 496 380" />

  <!-- lane 3 -->
  <rect class="box box-accent" x="676" y="116" width="250" height="66" rx="10" />
  <text class="t b" x="690" y="140" font-weight="600">Astro 5 静态构建</text>
  <text class="t s" x="690" y="160">[/] </text>
  <text class="t s" x="690" y="160" dx="22">/en/ · 同一份页面文件承载双语</text>

  <rect class="box" x="676" y="196" width="250" height="112" rx="10" />
  <text class="t b" x="690" y="220" font-weight="600">路由</text>
  <text class="t s" x="690" y="240">/day/&lt;date&gt;   日榜</text>
  <text class="t s" x="690" y="258">/week/&lt;end&gt;   周榜</text>
  <text class="t s" x="690" y="276">/month/&lt;end&gt;  月榜</text>
  <text class="t s" x="690" y="294">/project/&lt;date&gt;/&lt;slug&gt;/  详情（带日期）</text>

  <rect class="box" x="676" y="322" width="250" height="112" rx="10" />
  <text class="t b" x="690" y="346" font-weight="600">其它产物</text>
  <text class="t s" x="690" y="366">/archive/ /category/ /topic/</text>
  <text class="t s" x="690" y="384">/search/ /compare/ /export/</text>
  <text class="t s" x="690" y="402">/rss.xml · /data/*.json · /data/*.csv</text>

  <path class="flow" d="M 640 340 L 676 149" />
  <path class="flow" d="M 640 340 L 676 252" />
  <path class="flow" d="M 640 340 L 676 378" />

  <!-- deploy -->
  <rect class="box" x="676" y="452" width="250" height="52" rx="10" />
  <text class="t b" x="690" y="474" font-weight="600">GitHub Pages</text>
  <text class="t s" x="690" y="493">无服务器 · 无数据库 · 无运行时 API 调用</text>
  <path class="flow-strong" d="M 801 434 L 801 452" />

  <!-- footnote chips -->
  <rect class="chip" x="34" y="452" width="230" height="26" rx="13" />
  <text class="t chip-t" x="48" y="469">CRON 06:00 UTC · 抓取失败不推送</text>
  <rect class="chip" x="34" y="486" width="230" height="26" rx="13" />
  <text class="t chip-t" x="48" y="503">数据与代码分离，历史可回溯</text>
  <rect class="chip" x="34" y="520" width="230" height="26" rx="13" />
  <text class="t chip-t" x="48" y="537">外部输入统一净化后入库</text>
</svg>
